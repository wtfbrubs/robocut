[project]
name = "svc-watcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "clipbot-shared",
    "httpx>=0.27",
    "openai>=1.0",
    "yt-dlp>=2024.0",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
