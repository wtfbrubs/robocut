[project]
name = "svc-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "clipbot-shared",
    "redis>=5.0",
    "pyscenedetect[opencv]>=0.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
