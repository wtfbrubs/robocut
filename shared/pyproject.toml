[project]
name = "clipbot-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "structlog>=24.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipbot_shared"]
