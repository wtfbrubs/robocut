apiVersion: v1
kind: ConfigMap
metadata:
  name: clipbot-config
  namespace: clipbot
data:
  LOG_LEVEL: "INFO"
  CLIP_MAX_DURATION: "60"
  CLIP_MIN_DURATION: "10"
  CLIP_MIN_SCORE: "0.55"
  ENABLE_CAPTIONS: "false"
  CLIPS_BUCKET: "clipbot-clips"
  S3_ENDPOINT_URL: "http://minio-svc:9000"
  DETECTOR_WINDOW_SECONDS: "600"
  POLL_INTERVAL_SECONDS: "45"
  REDIS_URL: "redis://redis-svc:6379/0"
  DATABASE_URL: "postgresql+asyncpg://clipbot:$(POSTGRES_PASSWORD)@postgres-svc:5432/clipbot"
  CHANNELS_FILE: "/app/config/channels.yaml"
