version: "3.9"
services:
  watcher:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile
    env_file: .env.dev
    environment:
      PYTHONPATH: /app
      CHANNELS_FILE: /app/config/channels.yaml
    volumes:
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    env_file: .env.dev
    environment:
      PYTHONPATH: /app
    depends_on:
      - redis

  clip-worker:
    build:
      context: .
      dockerfile: services/clip-worker/Dockerfile
    env_file: .env.dev
    environment:
      PYTHONPATH: /app
      CHANNELS_FILE: /app/config/channels.yaml
    volumes:
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  uploader:
    build:
      context: .
      dockerfile: services/uploader/Dockerfile
    env_file: .env.dev
    environment:
      PYTHONPATH: /app
      CHANNELS_FILE: /app/config/channels.yaml
    volumes:
      - ./config:/app/config
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      postgres:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipbot
      POSTGRES_USER: clipbot
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  minio_data:
  redis_data:
  pg_data:
