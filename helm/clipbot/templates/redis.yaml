apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipbot-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: clipbot-redis
    {{- include "clipbot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clipbot-redis
  template:
    metadata:
      labels:
        app: clipbot-redis
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clipbot-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clipbot.labels" . | nindent 4 }}
spec:
  selector:
    app: clipbot-redis
  ports:
    - port: 6379
      targetPort: 6379
